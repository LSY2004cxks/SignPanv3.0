experiment:
  exp_name: handshape_data28_smoke_external_dual
  seed: 42
  runs_root: runs_smoke

data:
  data_root: ../data28
  manifest_path: manifest/manifest_smoke_tiny.jsonl
  split_dir: splits_smoke_manual
  k: 24
  k_candidates: [24]
  roi_size: 224
  cache_keypoints_dir: cache/keypoints
  cache_roi_dir: ../data28_roi_fixlen_mmpose
  cache_skeleton_dir: ../data28_mp_hand3d_effective
  cache_meta_dir: cache/meta
  num_workers: 0
  on_the_fly_fallback: false
  tier_weights:
    A: 1.0
    B: 0.8
    C: 0.5
    D: 0.2

preprocess:
  engine:
    default: mediapipe
    health_csv: ""
    swap_left_right: false
    fallback_max_frames: 3
    mmpose_pose2d: wholebody
    mediapipe_min_det_conf: 0.4

model:
  enforce_roi_skel_only: true
  mode: roi_skel_deform_nce
  roi_backbone: convnext_tiny
  roi_dim: 512
  skel_dim: 256
  fusion_hidden: 512
  dropout: 0.1
  pretrained: false
  freeze_backbone: false

loss:
  tau: 0.07
  lambda_nce: 0.05
  nce_start_epoch: 1

training:
  optimizer: AdamW
  lr_head: 3.0e-4
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-4
  batch_size: 2
  min_batch_size: 1
  epochs: 1
  stage1_epochs: 0
  early_stop_metric: hit@3
  patience: 2
  min_delta: 0.0005
  class_imbalance:
    strategy: class_balanced_sampler
    beta: 0.9999

inference:
  gating:
    margin_min: 0.2
    p1_min: 0.7

