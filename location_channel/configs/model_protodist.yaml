__base__: configs/default.yaml
model:
  name: protodist
  pool: logsumexp
  tau: 0.5
  hand_rep: center
  anchors:
    NC: {type: mid, a: left_shoulder, b: right_shoulder}
    FC: {type: joint, name: nose}
    FR: {type: joint, name: right_eye}
    FL: {type: joint, name: left_eye}
    EYR: {type: joint, name: right_eye}
    EYL: {type: joint, name: left_eye}
    EBR: {type: joint, name: right_eye}
    EBL: {type: joint, name: left_eye}
    CR: {type: joint, name: right_ear}
    CL: {type: joint, name: left_ear}
    NOC: {type: joint, name: nose}
    MC: {type: joint, name: nose}
    CC: {type: joint, name: nose}

    TTC: {type: torso_grid, row: top, col: center}
    TTR: {type: torso_grid, row: top, col: right}
    TTL: {type: torso_grid, row: top, col: left}
    TBC: {type: torso_grid, row: bottom, col: center}
    TBR: {type: torso_grid, row: bottom, col: right}
    TBL: {type: torso_grid, row: bottom, col: left}

    WL: {type: joint, name: left_hip}
    WR: {type: joint, name: right_hip}
    SL: {type: joint, name: left_shoulder}
    SR: {type: joint, name: right_shoulder}
    UAL: {type: segment_mid, a: left_shoulder, b: left_elbow}
    UAR: {type: segment_mid, a: right_shoulder, b: right_elbow}
    FAL: {type: segment_mid, a: left_elbow, b: left_wrist}
    FAR: {type: segment_mid, a: right_elbow, b: right_wrist}
    WIL: {type: joint, name: left_wrist}
    WIR: {type: joint, name: right_wrist}
    TL: {type: segment_mid, a: left_hip, b: left_knee}
    TR: {type: segment_mid, a: right_hip, b: right_knee}
