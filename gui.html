function formatCutLabel(ms) {
    return `${(Number(ms) / 1000).toFixed(2)}s`;
}

function syncUtteranceToPlayhead(currentMs) {
    const ms = Number(currentMs);
    const tokens = [...document.querySelectorAll('.utterance-token')];
    const status = document.getElementById('utteranceNow');
    if (!Number.isFinite(ms)) {
        if (status) status.textContent = '';
        return;
    }
    const active = new Set();
    const markInside = (includeEndpoint) => {
        tokens.forEach(token => {
            const start = Number(token.dataset.start);
            const end = Number(token.dataset.end);
            const inside = ms >= start && ms < end;
            const atEnd = includeEndpoint && ms === end && end > start;
            if (inside || atEnd) active.add(token.dataset.segment);
        });
    };
    markInside(false);
    if (!active.size) markInside(true);
    const showSegment = segmentId => active.has(segmentId);
    tokens.forEach(token => {
        token.classList.toggle('is-idle', !showSegment(token.dataset.segment));
    });
    document.querySelectorAll('.annotation-matrix [data-segment]').forEach(node => {
        node.classList.toggle('is-idle', !showSegment(node.dataset.segment));
    });
    document.querySelectorAll('.timeline-tier-block[data-segment]').forEach(node => {
        node.classList.toggle('is-active', showSegment(node.dataset.segment));
    });
    if (!status) return;
    if (!active.size) {
        status.textContent = `当前时间 ${formatCutLabel(ms)} 不在切分段内（可按 N 或点击“+ 在播放头新建”在此处添加切分）`;
        status.classList.add('is-gap');
        return;
    }
    const parts = [...active].map(id => {
        const sample = tokens.find(token => token.dataset.segment === id);
        return `${id} · ${formatCutLabel(sample.dataset.start)}–${formatCutLabel(sample.dataset.end)}`;
    });
    status.textContent = `当前切分段 ${parts.join('；')}`;
    status.classList.remove('is-gap');
}

function renderTimeline(results) {
    const videoPlayer = document.getElementById('videoPlayer');
    const annotationEnd = Math.max(
        1000,
        ...(results || []).map((item, index) => intervalFor(item, index)[1])
    );
    const videoDurationMs = Number(videoPlayer.duration) * 1000;
    const maximum = Math.max(
        Math.ceil(annotationEnd / 1000) * 1000,
        Number.isFinite(videoDurationMs) && videoDurationMs > 0 ? Math.round(videoDurationMs) : 3000
    );
    const cutTimes = [];
    const seenCuts = new Set();
    (results || []).forEach((item, index) => {
        const [start, end] = intervalFor(item, index);
        [start, end].forEach(value => {
            const ms = Math.round(Number(value));
            if (!Number.isFinite(ms) || ms < 0 || ms > maximum || seenCuts.has(ms)) return;
            seenCuts.add(ms);
            cutTimes.push(ms);
        });
    });
    cutTimes.sort((a, b) => a - b);
    const scale = cutTimes.map(value => {
        const percent = value / maximum * 100;
        const edge = percent <= 6 ? 'first' : percent >= 94 ? 'last' : '';
        return `<span class="timeline-scale-mark ${edge}"
            style="left:${percent}%" title="${value} ms">${formatCutLabel(value)}</span>`;
    }).join('');
    const currentMs = Math.min(
        maximum,
        Math.max(0, Number(videoPlayer.currentTime || 0) * 1000)
    );
    const progressPercent = currentMs / maximum * 100;

    const segments = new Map();
    (results || []).forEach((item, index) => {
        const [start, end] = intervalFor(item, index);
        const id = item.standard.segment_id;
        const segment = segments.get(id) || {
            id, start, end, roles: new Set(), firstIndex: index
        };
        segment.start = Math.min(segment.start, start);
        segment.end = Math.max(segment.end, end);
        segment.roles.add(item.standard.hand_role);
        segments.set(id, segment);
    });
    const visibleSegments = [...segments.values()].filter(segment =>
        !isUnannotatedSpan(segment.start, segment.end)
    );
    const visibleHands = (results || []).filter((item, index) => {
        const [start, end] = intervalFor(item, index);
        return !isUnannotatedSpan(start, end);
    });
    const segmentBlocks = visibleSegments.map(segment => {
        const left = Math.max(0, segment.start / maximum * 100);
        const width = Math.max(0.7, (segment.end - segment.start) / maximum * 100);
        const roles = [...segment.roles].sort().join('+');
        const label = `${segment.id} · ${roles}`;
        return `<button class="timeline-tier-block segment-block"
            data-segment="${escapeHtml(segment.id)}"
            data-start="${segment.start}" data-end="${segment.end}"
            style="left:${left}%;width:${width}%"
            title="${escapeHtml(label)} · ${segment.start}-${segment.end} ms（左右边缘可拖拽调整边界，右键打开切分菜单）"
            onclick="seekToEvent(${segment.firstIndex})"
            oncontextmenu="openTimelineContextMenu(event, {type:'segment', segmentId:'${escapeHtml(segment.id)}', maxMs:${maximum}})">
            <span class="block-resize-handle left" onpointerdown="beginSegmentResize(event, '${escapeHtml(segment.id)}', 'start_ms', ${maximum})" onclick="event.stopPropagation()"></span>
            ${escapeHtml(label)}
            <span class="block-resize-handle right" onpointerdown="beginSegmentResize(event, '${escapeHtml(segment.id)}', 'end_ms', ${maximum})" onclick="event.stopPropagation()"></span>
        </button>`;
    }).join('');
    const timelineTiers = [
        ['Handshape', item => item.channels?.handshape?.prediction?.label],
        ['Location', item => item.channels?.location?.prediction?.label],
        ['Orientation', item => item.channels?.orientation?.prediction?.label],
        ['Movement', item => item.channels?.movement?.prediction?.label]
    ];
    const handLanes = ['H1', 'H2'].flatMap(role =>
        timelineTiers.map(([tierName, valueFor]) => {
            const blocks = (results || []).map((item, index) => {
                if (item.standard.hand_role !== role ||
                    item.standard.participation === 'inactive') return '';
                const [start, end] = intervalFor(item, index);
                if (isUnannotatedSpan(start, end)) return '';
                const left = Math.max(0, start / maximum * 100);
                const width = Math.max(0.7, (end - start) / maximum * 100);
                const value = valueFor(item) || '—';
                return `<button class="timeline-tier-block ${role === 'H2' ? 'h2' : ''}"
                    data-segment="${escapeHtml(item.standard.segment_id)}"
                    data-start="${start}" data-end="${end}"
                    style="left:${left}%;width:${width}%"
                    title="${escapeHtml(item.standard.segment_id)} · ${escapeHtml(value)} · ${start}-${end} ms（右键可拆分或删除）"
                    onclick="seekToEvent(${index})"
                    oncontextmenu="openTimelineContextMenu(event, {type:'hand', segmentId:'${escapeHtml(item.standard.segment_id)}', eventIndex:${index}, role:'${role}', maxMs:${maximum}})">${escapeHtml(value)}</button>`;
            }).join('');
            return `<div class="timeline-lane">
                <span class="timeline-lane-label">${role} · ${tierName}</span>
                <div class="timeline-rail"
                    ondblclick="handleRailDoubleClick(event, '${role}', ${maximum})"
                    oncontextmenu="openTimelineContextMenu(event, {type:'rail', role:'${role}', maxMs:${maximum}})">${blocks}</div>
            </div>`;
        })
    ).join('');
    return `<section class="timeline-panel">
        <div class="timeline-heading">
            <strong>SignPan 多层音系标注时间轴（ELAN 风格切分编辑）</strong>
            <span>${visibleSegments.length} 个时间段 / ${visibleHands.length} 个手部标注 · 支持拖拽边界、双击空白轨新建、右键菜单</span>
        </div>
        <div class="timeline-toolbar" role="toolbar" aria-label="切分编辑工具栏">
            <select aria-label="新建切分段手部模式" onchange="newSegmentHandMode = this.value">
                <option value="both" ${newSegmentHandMode === 'both' ? 'selected' : ''}>新建：H1+H2 双手</option>
                <option value="H1" ${newSegmentHandMode === 'H1' ? 'selected' : ''}>新建：仅 H1 主手</option>
                <option value="H2" ${newSegmentHandMode === 'H2' ? 'selected' : ''}>新建：仅 H2 辅手</option>
            </select>
            <button type="button" class="timeline-tool-btn primary" onclick="addSegmentAtMs(getPlayheadMs(), newSegmentHandMode)" title="在当前视频播放头位置新增一个切分段（快捷键 N）">
                + 在播放头新建 <span class="timeline-tool-kbd">N</span>
            </button>
            <button type="button" class="timeline-tool-btn" onclick="splitSegmentAtMs()" title="在播放头位置将当前切分段一分为二（快捷键 S）">
                ✂ 在播放头拆分 <span class="timeline-tool-kbd">S</span>
            </button>
            <button type="button" class="timeline-tool-btn" onclick="mergeSegmentWithNext()" title="将当前切分段与紧邻的下一段合并（快捷键 M）">
                ⇄ 合并下一段 <span class="timeline-tool-kbd">M</span>
            </button>
            <button type="button" class="timeline-tool-btn" onclick="repredictSegment()" title="对当前切分段重新运行四通道模型/几何推理">
                ⟳ 重算当前段
            </button>
            <button type="button" class="timeline-tool-btn danger" onclick="deleteSegmentById()" title="删除播放头所在的切分段（快捷键 Delete）">
                🗑 删除当前段 <span class="timeline-tool-kbd">Del</span>
            </button>
            <span class="timeline-tool-hint">提示：右键轨道或色块可呼出菜单，拖拽 Segment 左右边缘可微调起止时间</span>
        </div>
        <div class="timeline-lanes">
            <div class="timeline-lane">
                <span class="timeline-lane-label">视频进度</span>
                <div class="timeline-progress-wrap">
                    <input class="timeline-progress" id="timelineProgress"
                        type="range" min="0" max="${maximum}" step="1" value="${currentMs}"
                        style="background:linear-gradient(90deg,var(--primary) ${progressPercent}%,#101c2f ${progressPercent}%)"
                        aria-label="视频播放进度"
                        onpointerdown="beginVideoScrub(event)"
                        oninput="seekVideoProgress(this)"
                        onchange="endVideoScrub()">
                    ${scale}
                </div>
            </div>
            <div class="timeline-lane">
                <span class="timeline-lane-label">Segment</span>
                <div class="timeline-rail"
                    ondblclick="handleRailDoubleClick(event, newSegmentHandMode, ${maximum})"
                    oncontextmenu="openTimelineContextMenu(event, {type:'rail', role:newSegmentHandMode, maxMs:${maximum}})">${segmentBlocks}</div>
            </div>
            ${handLanes}
        </div>
    </section>`;
}

function msFromRailEvent(event, maxMs) {
    const rail = event.currentTarget.closest?.('.timeline-rail') || event.target.closest?.('.timeline-rail');
    if (!rail) return getPlayheadMs();
    const rect = rail.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / Math.max(rect.width, 1)));
    return Math.round(ratio * (Number(maxMs) || 1000));
}

function handleRailDoubleClick(event, roleHint, maxMs) {
    if (event.target.closest('.timeline-tier-block')) return;
    const clickMs = msFromRailEvent(event, maxMs);
    addSegmentAtMs(clickMs, roleHint || newSegmentHandMode);
}

function beginSegmentResize(event, segmentId, field, maxMs) {
    event.stopPropagation();
    event.preventDefault();
    closeTimelineContextMenu();
    const rail = event.currentTarget.closest('.timeline-rail');
    if (!rail) return;
    const rect = rail.getBoundingClientRect();
    const segments = collectTimelineSegments();
    const targetSeg = segments.find(seg => seg.id === segmentId);
    if (!targetSeg) return;

    let latestMs = field === 'start_ms' ? targetSeg.start : targetSeg.end;
    const onMove = moveEvent => {
        const ratio = Math.max(0, Math.min(1, (moveEvent.clientX - rect.left) / Math.max(rect.width, 1)));
        const rawMs = Math.round(ratio * (Number(maxMs) || 1000));
        if (field === 'start_ms') {
            latestMs = Math.max(0, Math.min(rawMs, targetSeg.end - MIN_ANNOTATION_MS));
        } else {
            latestMs = Math.max(targetSeg.start + MIN_ANNOTATION_MS, rawMs);
        }
    };
    const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        currentResults
            .filter(item => item.standard?.segment_id === segmentId)
            .forEach(item => {
                item.standard[field] = latestMs;
                item.standard.modified_at = new Date().toISOString();
                item.standard.source = 'human_annotation';
                syncEventSpanFromMs(item);
            });
        hasUnsavedChanges = true;
        renderResults(currentResults, true);
        syncUtteranceToPlayhead(field === 'start_ms' ? latestMs : targetSeg.start);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp, {once: true});
}

function ensureContextMenuElement() {
    let menu = document.getElementById('timelineContextMenu');
    if (!menu) {
        menu = document.createElement('div');
        menu.id = 'timelineContextMenu';
        menu.className = 'timeline-context-menu';
        document.body.appendChild(menu);
    }
    return menu;
}

function closeTimelineContextMenu() {
    const menu = document.getElementById('timelineContextMenu');
    if (menu) menu.classList.remove('open');
}

function openTimelineContextMenu(event, ctx) {
    event.preventDefault();
    event.stopPropagation();
    const clickMs = msFromRailEvent(event, ctx.maxMs);
    const menu = ensureContextMenuElement();
    const segments = collectTimelineSegments();
    const seg = ctx.segmentId
        ? segments.find(s => s.id === ctx.segmentId)
        : segments.find(s => clickMs >= s.start && clickMs < s.end);

    const items = [];
    items.push(`<div class="context-menu-header">时间轴位置：${formatCutLabel(clickMs)} (${clickMs} ms)${seg ? ` · ${escapeHtml(seg.id)}` : ''}</div>`);

    if (seg) {
        const canSplitHere = clickMs - seg.start >= MIN_ANNOTATION_MS && seg.end - clickMs >= MIN_ANNOTATION_MS;
        items.push(`<button type="button" class="context-menu-item" onclick="splitSegmentAtMs(${canSplitHere ? clickMs : 'null'}, '${escapeHtml(seg.id)}')">
            <span>✂ ${canSplitHere ? `在此位置 (${formatCutLabel(clickMs)}) 拆分` : `在 ${escapeHtml(seg.id)} 中点拆分`}</span>
            <span class="timeline-tool-kbd">S</span>
        </button>`);
        if (seg.hands.size < 2) {
            items.push(`<button type="button" class="context-menu-item" onclick="addMissingHandToSegment('${escapeHtml(seg.id)}')">
                <span>+ 为 ${escapeHtml(seg.id)} 补齐另一只手</span>
            </button>`);
        }
        items.push(`<button type="button" class="context-menu-item" onclick="mergeSegmentWithNext('${escapeHtml(seg.id)}')">
            <span>⇄ 与下一切分段合并</span>
            <span class="timeline-tool-kbd">M</span>
        </button>`);
        items.push(`<button type="button" class="context-menu-item" onclick="repredictSegment('${escapeHtml(seg.id)}')">
            <span>⟳ 重算 ${escapeHtml(seg.id)} 四通道预测</span>
        </button>`);
        items.push(`<div class="context-menu-divider"></div>`);
        if (ctx.type === 'hand' && Number.isInteger(ctx.eventIndex) && seg.hands.size >= 2) {
            items.push(`<button type="button" class="context-menu-item danger" onclick="deleteHandEvent(${ctx.eventIndex})">
                <span>× 仅删除 ${escapeHtml(ctx.role || '')} 手部事件</span>
            </button>`);
        }
        items.push(`<button type="button" class="context-menu-item danger" onclick="deleteSegmentById('${escapeHtml(seg.id)}')">
            <span>🗑 删除整个切分段 ${escapeHtml(seg.id)}</span>
            <span class="timeline-tool-kbd">Del</span>
        </button>`);
    } else {
        items.push(`<button type="button" class="context-menu-item" onclick="addSegmentAtMs(${clickMs}, 'both')">
            <span>+ 在此处新建 H1+H2 双手切分段</span>
            <span class="timeline-tool-kbd">N</span>
        </button>`);
        items.push(`<button type="button" class="context-menu-item" onclick="addSegmentAtMs(${clickMs}, 'H1')">
            <span>+ 在此处仅新建 H1（主手）切分段</span>
        </button>`);
        items.push(`<button type="button" class="context-menu-item" onclick="addSegmentAtMs(${clickMs}, 'H2')">
            <span>+ 在此处仅新建 H2（辅手）切分段</span>
        </button>`);
    }

    menu.innerHTML = items.join('');
    menu.classList.add('open');
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const left = Math.min(event.clientX, Math.max(8, vw - 250));
    const top = Math.min(event.clientY, Math.max(8, vh - 260));
    menu.style.left = `${left}px`;
    menu.style.top = `${top}px`;
}

document.addEventListener('click', () => closeTimelineContextMenu());
document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
        closeTimelineContextMenu();
        return;
    }
    const tag = (event.target?.tagName || '').toLowerCase();
    if (['input', 'select', 'textarea'].includes(tag) || event.target?.isContentEditable) return;
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    const resultsVisible = document.querySelector('.result-panel')?.classList.contains('result-ready');
    if (!resultsVisible) return;

    const key = event.key.toLowerCase();
    if (key === 'n') {
        event.preventDefault();
        addSegmentAtMs(getPlayheadMs(), newSegmentHandMode);
    } else if (key === 's') {
        event.preventDefault();
        splitSegmentAtMs();
    } else if (key === 'm') {
        event.preventDefault();
        mergeSegmentWithNext();
    } else if (event.key === 'Delete') {
        event.preventDefault();
        deleteSegmentById();
    }
});

function editMeta(field, value) {
    if (field === 'dominant_hand') {
        currentAnnotationMeta.dominant_hand = value;
        currentResults.forEach(item => {
            item.standard ||= {};
            item.standard.hand_role = String(item.hand || '').toLowerCase() === value ? 'H1' : 'H2';
        });
    } else {
        currentAnnotationMeta[field] = String(value).trim();
    }
    hasUnsavedChanges = true;
    renderResults(currentResults, true);
}

function editStandard(eventIndex, field, value, numeric = false) {
    const event = currentResults[eventIndex];
    if (!event) return;
    event.standard ||= {};
    const nextValue = numeric ? Math.round(Number(value)) : String(value).trim();
    if (numeric && (!Number.isFinite(nextValue) || nextValue < 0)) {
        toast('时间必须是非负整数毫秒', 'error');
        renderResults(currentResults, true);
        return;
    }
    const segmentId = event.standard.segment_id;
    if (field === 'start_ms' || field === 'end_ms') {
        const start = field === 'start_ms' ? nextValue : Number(event.standard.start_ms);
        const end = field === 'end_ms' ? nextValue : Number(event.standard.end_ms);
        if (start >= end) {
            toast('起始时间必须小于结束时间', 'error');
            renderResults(currentResults, true);
            return;
        }
        currentResults.filter(item => item.standard?.segment_id === segmentId)
            .forEach(item => {
                item.standard[field] = nextValue;
                syncEventSpanFromMs(item);
            });
    } else {
        event.standard[field] = nextValue;
    }
    event.standard.modified_at = new Date().toISOString();
    event.standard.source = 'human_annotation';
    hasUnsavedChanges = true;
    renderResults(currentResults, true);
}

function selectStandardCandidate(eventIndex, field, select) {
    if (!select.value) return;
    editStandard(eventIndex, field, select.value);
}

function seekToEvent(eventIndex) {
    const event = currentResults[eventIndex];
    if (!event) return;
    const video = document.getElementById('videoPlayer');
    seekToMs(
        Number(event.standard?.start_ms || 0),
        Number(event.standard?.end_ms || 0)
    );
}

function updateVideoProgressBar(input) {
    if (!input) return;
    const maximum = Number(input.max) || 1;
    const percent = Math.max(0, Math.min(100, Number(input.value) / maximum * 100));
    input.style.background = `linear-gradient(90deg,var(--primary) ${percent}%,#101c2f ${percent}%)`;
}

let videoScrubbing = false;

function beginVideoScrub(event) {
    videoScrubbing = true;
    const video = document.getElementById('videoPlayer');
    if (video) {
        delete video.dataset.stopAt;
        video.pause();
    }
    if (event?.currentTarget?.setPointerCapture && event.pointerId !== undefined) {
        try { event.currentTarget.setPointerCapture(event.pointerId); } catch (error) {}
    }
    window.addEventListener('pointerup', endVideoScrub, {once: true});
    window.addEventListener('pointercancel', endVideoScrub, {once: true});
}

function endVideoScrub() {
    if (!videoScrubbing) return;
    videoScrubbing = false;
    const progress = document.getElementById('timelineProgress');
    if (progress) seekVideoProgress(progress);
}

function seekVideoProgress(input) {
    const video = document.getElementById('videoPlayer');
    if (!video || !input) return;
    const seconds = Number(input.value || 0) / 1000;
    if (!Number.isFinite(seconds)) return;
    delete video.dataset.stopAt;
    const duration = Number(video.duration);
    const target = Number.isFinite(duration) && duration > 0
        ? Math.min(Math.max(0, seconds), Math.max(0, duration - 0.04))
        : Math.max(0, seconds);
    video.pause();
    if (Math.abs((Number(video.currentTime) || 0) - target) > 0.03) {
        video.currentTime = target;
    }
    updateVideoProgressBar(input);
    syncUtteranceToPlayhead(target * 1000);
}

function seekToMs(startMs, endMs) {
    const video = document.getElementById('videoPlayer');
    video.currentTime = Number(startMs || 0) / 1000;
    video.dataset.stopAt = String(Number(endMs || 0) / 1000);
    syncUtteranceToPlayhead(Number(startMs || 0));
    video.play().catch(() => {});
}

document.getElementById('videoPlayer').addEventListener('timeupdate', event => {
    const progress = document.getElementById('timelineProgress');
    const currentMs = event.currentTarget.currentTime * 1000;
    if (progress && !videoScrubbing && !event.currentTarget.paused) {
        progress.value = String(currentMs);
        updateVideoProgressBar(progress);
    }
    syncUtteranceToPlayhead(currentMs);
    const stopAt = Number(event.currentTarget.dataset.stopAt);
    if (Number.isFinite(stopAt) && stopAt > 0 && event.currentTarget.currentTime >= stopAt) {
        event.currentTarget.pause();
        delete event.currentTarget.dataset.stopAt;
    }
});
document.getElementById('videoPlayer').addEventListener('loadedmetadata', () => {
    if (currentResults.length) renderResults(currentResults, true);
});

function renderSummary(results) {
    let available = 0;
    let modified = 0;
    let needsReview = 0;
    let invalidLabels = 0;
    results.forEach((event, index) => {
        const [startMs, endMs] = intervalFor(event, index);
        if (isUnannotatedSpan(startMs, endMs)) return;
        const channels = event.channels || {};
        CHANNEL_KEYS.forEach(key => {
            const channel = channels[key];
            if (channel?.status?.code === 'OK') available++;
            if (channel?.metadata?.human_modified) modified++;
        });
        if (['uncertain', 'unobservable'].includes(event.standard?.annotation_status)) {
            needsReview++;
        }
        const values = [
            [channels.handshape?.prediction?.label, STANDARD_LABELS.handshape],
            [channels.location?.prediction?.label, STANDARD_LABELS.location],
            [channels.orientation?.prediction?.label, STANDARD_LABELS.orientation],
            [channels.movement?.prediction?.label, STANDARD_LABELS.movement]
        ];
        values.forEach(([value, allowed]) => {
            if (value && !allowed.includes(value)) invalidLabels++;
        });
    });
    const visible = results.filter((event, index) => {
        const [startMs, endMs] = intervalFor(event, index);
        return !isUnannotatedSpan(startMs, endMs);
    });
    const total = visible.length * CHANNEL_COUNT;
    const segments = new Set(visible.map(event => event.standard?.segment_id)).size;
    const draft = results.some(event => event.segmentation?.source === 'unnumbered');
    const syncText = hasUnsavedChanges
        ? '● 有未保存修改'
        : draft
            ? '模型草稿 · 待复核'
            : '✓ 已同步';
    document.getElementById('resultSummary').innerHTML = `
        <span class="summary-pill"><strong>${segments}</strong> 个时间段（Segment）/ ${visible.length} 个手部标注</span>
        <span class="summary-pill"><strong>${available}/${total}</strong> 个可用通道</span>
        <span class="summary-pill"><strong>${modified}</strong> 项人工修订</span>
        <span class="summary-pill"><strong>${needsReview}</strong> 项待复核</span>
        <span class="summary-pill"><strong>${invalidLabels}</strong> 个非规范标签</span>
        <span class="summary-pill">${syncText}</span>`;
    const saveButton = document.getElementById('saveBtn');
    saveButton.textContent = hasUnsavedChanges ? '保存修改 · 未保存' : '保存修改';
}

function toggleJson(el) {
    const raw = el.nextElementSibling;
    raw.style.display = raw.style.display === 'none' ? 'block' : 'none';
}

function renderNmfPanel() {
    const nmf = ensureNmf();
    const statuses = [
        ['observed_absent', 'observed_absent · 已观察，无事件'],
        ['observed', 'observed · 有事件'],
        ['unobservable', 'unobservable · 不可观察'],
        ['uncertain', 'uncertain · 无法确定']
    ];
    return `<details class="standard-panel">
        <summary>非手动参数 · 面部 / 躯干</summary>
        <div class="standard-grid">
            <div class="standard-field"><label>观察状态</label>
                <select onchange="editNmfStatus(this.value)">
                    ${statuses.map(([value, text]) => `<option value="${value}" ${nmf.status === value ? 'selected' : ''}>${text}</option>`).join('')}
                </select></div>
            <p class="standard-help">面部和躯干按自己的起止时间记录，可以跨过多个 Segment。符号来自规范附录表。</p>
        </div>
        ${renderNmfEvents('facial_events', '面部', 'facial')}
        ${renderNmfEvents('torso_events', '躯干', 'torso')}
    </details>`;
}

function renderNmfEvents(bucket, title, listName) {
    const nmf = ensureNmf();
    const rows = (nmf[bucket] || []).map((item, index) => `
        <div class="standard-grid">
            <div class="standard-field"><label>${title}符号</label>
                <input list="labels-${listName}" value="${escapeHtml(item.label || '')}"
                    onchange="editNmfEvent('${bucket}', ${index}, 'label', this.value)"></div>
            <div class="standard-field"><label>起始毫秒</label>
                <input type="number" min="0" value="${Number(item.start_ms) || 0}"
                    onchange="editNmfEvent('${bucket}', ${index}, 'start_ms', this.value)"></div>
            <div class="standard-field"><label>结束毫秒</label>
                <input type="number" min="1" value="${Number(item.end_ms) || 1}"
                    onchange="editNmfEvent('${bucket}', ${index}, 'end_ms', this.value)"></div>
            <div class="standard-field"><label>操作</label>
                <button type="button" class="btn btn-danger btn-small" onclick="removeNmfEvent('${bucket}', ${index})">删除</button></div>
        </div>`).join('');
    return `<div class="nmf-block">
        <button type="button" class="btn btn-secondary btn-small" onclick="addNmfEvent('${bucket}', '${listName}')">添加${title}事件</button>
        ${rows || `<p class="standard-help">还没有${title}事件。</p>`}
    </div>`;
}

function addNmfEvent(bucket, listName) {
    const nmf = ensureNmf();
    const prefix = bucket === 'facial_events' ? 'FE' : 'TM';
    nmf[bucket].push({
        event_id: `${prefix}${nmf[bucket].length + 1}`,
        label: STANDARD_LABELS[listName][0],
        start_ms: 0,
        end_ms: 1000
    });
    if (nmf.status === 'observed_absent') nmf.status = 'observed';
    hasUnsavedChanges = true;
    renderResults(currentResults, true);
}

function editNmfEvent(bucket, index, field, value) {
    const nmf = ensureNmf();
    const item = nmf[bucket]?.[index];
    if (!item) return;
    if (field === 'start_ms' || field === 'end_ms') {
        const nextValue = Math.round(Number(value));
        if (!Number.isFinite(nextValue) || nextValue < 0) {
            toast('时间必须是非负整数毫秒', 'error');
            renderResults(currentResults, true);
            return;
        }
        const start = field === 'start_ms' ? nextValue : Number(item.start_ms);
        const end = field === 'end_ms' ? nextValue : Number(item.end_ms);
        if (start >= end) {
            toast('起始时间必须小于结束时间', 'error');
            renderResults(currentResults, true);
            return;
        }
        item[field] = nextValue;
    } else {
        const label = String(value || '').trim();
        if (!labelIsStandard(bucket === 'facial_events' ? 'facial' : 'torso', label)) {
            toast('输入错误', 'error');
            renderResults(currentResults, true);
            return;
        }
        item.label = label;
    }
    hasUnsavedChanges = true;
    renderResults(currentResults, true);
}

function removeNmfEvent(bucket, index) {
    const nmf = ensureNmf();
    nmf[bucket].splice(index, 1);
    if (!nmf.facial_events.length && !nmf.torso_events.length && nmf.status === 'observed') {
        nmf.status = 'observed_absent';
    }
    hasUnsavedChanges = true;
    renderResults(currentResults, true);
}

function editNmfStatus(value) {
    const nmf = ensureNmf();
    nmf.status = value;
    if (value === 'observed_absent') {
        nmf.facial_events = [];
        nmf.torso_events = [];
    }
    hasUnsavedChanges = true;
    renderResults(currentResults, true);
}

function labelIsStandard(listName, value) {
    const allowed = STANDARD_LABELS[listName] || [];
    return allowed.includes(String(value || '').trim());
}

function manualLabelsAreStandard() {
    for (const event of currentResults) {
        for (const key of ['handshape', 'location', 'orientation', 'movement']) {
            const channel = event.channels?.[key];
            if (!channel) continue;
            const metadata = channel.metadata || {};
            const human = metadata.human_modified || metadata.source === 'human_annotation';
            if (!human) continue;
            if (!labelIsStandard(key, channel.prediction?.label)) return false;
        }
    }
    const nmf = currentAnnotationMeta.nmf || {};
    for (const item of nmf.facial_events || []) {
        if (!labelIsStandard('facial', item.label)) return false;
    }
    for (const item of nmf.torso_events || []) {
        if (!labelIsStandard('torso', item.label)) return false;
    }
    return true;
}

function editLabel(eventIndex, channelName, value) {
    const channel = currentResults[eventIndex]?.channels?.[channelName];
    if (!channel) return;
    const label = String(value || '').trim();
    if (!labelIsStandard(channelName, label)) {
        toast('输入错误', 'error');
        renderResults(currentResults, true);
        return;
    }
    channel.prediction = channel.prediction || {};
    channel.metadata = channel.metadata || {};
    if (!channel.metadata.human_modified) {
        channel.metadata.model_label = channel.prediction.label || null;
        channel.metadata.original_source = channel.metadata.source || null;
    }
    channel.prediction.label = label;
    channel.metadata.human_label = label;
    channel.metadata.human_modified = true;
    channel.metadata.modified_at = new Date().toISOString();
    channel.metadata.source = 'human_annotation';
    channel.status = {code: 'OK', message: '人工标注'};
    hasUnsavedChanges = true;
    renderResults(currentResults, true);
}

function selectCandidate(eventIndex, channelName, encodedLabel) {
    editLabel(eventIndex, channelName, decodeURIComponent(encodedLabel));
}

function selectCandidateFromDropdown(eventIndex, channelName, select) {
    if (!select.value) return;
    editLabel(eventIndex, channelName, select.value);
}

async function saveEdits() {
    if (!currentTaskId || !currentResults.length) {
        toast('没有可保存的结果', 'error');
        return false;
    }
    if (!manualLabelsAreStandard()) {
        toast('输入错误', 'error');
        return false;
    }
    const button = document.getElementById('saveBtn');
    button.disabled = true;
    try {
        const response = await fetch('/save/' + encodeURIComponent(currentTaskId), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                result: currentResults,
                annotation_meta: currentAnnotationMeta
            })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '保存失败');
        hasUnsavedChanges = false;
        renderSummary(currentResults);
        toast('标注已保存', 'success');
        refreshHistory(1);
        return true;
    } catch (error) {
        toast('保存失败: ' + error.message, 'error');
        return false;
    } finally {
        button.disabled = false;
    }
}

async function exportResult(format) {
    const saved = await saveEdits();
    if (!saved) return;
    const link = document.createElement('a');
    link.href = `/export/${encodeURIComponent(currentTaskId)}?format=${format}`;
    link.download = '';
    document.body.appendChild(link);
    link.click();
    link.remove();
}

async function refreshHistory(page) {
    const select = document.getElementById('historySelect');
    const requested = Number.isInteger(page) ? page : historyPage;
    const previous = select.value;
    try {
        const response = await fetch(`/api/annotations?page=${requested}&page_size=8`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '加载失败');
        const items = data.items || [];
        historyPage = data.page || 1;
        historyPages = data.pages || 1;
        select.innerHTML = items.length
            ? items.map(item => {
                const title = `${item.video_name || item.task_id || item.name} · ${item.event_count} 个事件 · ${item.saved_at || ''}`;
                return `<option value="${escapeHtml(item.name)}">${escapeHtml(title)}</option>`;
            }).join('')
            : '<option value="">暂无已保存结果</option>';
        if (previous && [...select.options].some(option => option.value === previous)) {
            select.value = previous;
        }
    } catch (error) {
        select.innerHTML = '<option value="">历史记录加载失败</option>';
    }
    const pageLabel = document.getElementById('historyPage');
    pageLabel.textContent = `${historyPage} / ${historyPages}`;
    document.getElementById('historyPrev').disabled = historyPage <= 1;
    document.getElementById('historyNext').disabled = historyPage >= historyPages;
}

function changeHistoryPage(delta) {
    const next = historyPage + delta;
    if (next < 1 || next > historyPages) return;
    refreshHistory(next);
}

async function loadHistory() {
    const name = document.getElementById('historySelect').value;
    if (!name) {
        toast('请选择历史标注', 'error');
        return;
    }
    if (hasUnsavedChanges && !confirm('当前修改尚未保存，确定打开其他标注吗？')) {
        return;
    }
    try {
        const response = await fetch('/api/annotations/' + encodeURIComponent(name));
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '加载失败');
        currentTaskId = data.task_id;
        currentHistoryName = name;
        currentAnnotationMeta = {
            ...createAnnotationMeta(),
            ...(data.annotation_meta || {})
        };
        renderResults(data.result);
        toast('历史标注已加载，可继续修改', 'success');
    } catch (error) {
        toast('加载失败: ' + error.message, 'error');
    }
}

async function deleteHistory() {
    const select = document.getElementById('historySelect');
    const name = select.value;
    if (!name) {
        toast('请选择要删除的历史标注', 'error');
        return;
    }
    const label = select.selectedOptions[0]?.textContent || name;
    if (!confirm(`确定删除这条历史标注吗？\n${label}\n删除后无法恢复。`)) return;
    try {
        const response = await fetch('/api/annotations/' + encodeURIComponent(name), {
            method: 'DELETE'
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '删除失败');
        if (currentHistoryName === name) {
            currentHistoryName = null;
            hasUnsavedChanges = Boolean(currentResults.length);
            toast('已删除保存的文件。当前画面仍保留这份内容，需要的话请重新保存。', 'success');
        } else {
            toast('历史标注已删除', 'success');
        }
        await refreshHistory(historyPage);
    } catch (error) {
        toast('删除失败: ' + error.message, 'error');
    }
}

function resetAll() {
    if (hasUnsavedChanges && !confirm('当前修改尚未保存，确定重置吗？')) {
        return;
    }
    selectedFile = null;
    currentTaskId = null;
    currentHistoryName = null;
    currentResults = [];
    currentAnnotationMeta = createAnnotationMeta();
    if (pollInterval) clearInterval(pollInterval);
    document.getElementById('fileInput').value = '';
    document.getElementById('videoPreview').style.display = 'none';
    document.getElementById('inputPanel').classList.remove('has-video');
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = null;
    document.getElementById('videoPlayer').src = '';
    document.getElementById('predictBtn').disabled = true;
    const manualBtn = document.getElementById('manualSegBtn');
    if (manualBtn) manualBtn.disabled = true;
    document.getElementById('progressSection').style.display = 'none';
    document.getElementById('resultsSection').style.display = 'none';
    document.getElementById('resultsContent').innerHTML = '';
    showEmptyState('等待预测结果', '从左侧上传视频并开始预测，结果将在这里按事件展示。');
}

function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
}

refreshHistory();
</script>
</body>
</html>
