inherit: full.yaml
output_root: outputs/exp_modal_roi_skel_text_kv

params:
  roi_input: auto

model:
  roi_backbone: resnet18
  geom_encoder_type: stgcn
  use_roi: true
  use_geom: true
  use_normal: false
  use_text: true
  use_text_as_kv: true

train:
  lr: 1.0e-4
  epochs: 36
  batch_size: 8
  num_workers: 8
